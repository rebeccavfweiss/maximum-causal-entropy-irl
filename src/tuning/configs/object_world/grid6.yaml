environment:
  type: object_world
  gamma: 0.95
  grid_size: 16
  T: 50
  random_start: true
  continuous: false
  theta: [1.0, 1.0, -2.0]
  n_objects: 9
  n_trajectories_eval: 100

demonstrator:
  n_trajectories: 500
  T: 8

wandb:
  project: "mceirl-object-world-tuning"
  sweep_count: 50

sweep:
  method: bayes
  metric:
    name: reward_diff_variance
    goal: maximize
  parameters:
    env_gamma:
      values: [1.0, 0.99, 0.975, 0.95, 0.9]
    env_T:
      values: [20, 50, 100]
    # Learner convergence (shared)
    tol_exp:
      value: 1.0
    maxiter:
      value: 2500
    miniter:
      value: 1
    early_stop_window:
      value: 200
    # Optimizer config (shared - theta_e)
    optimizer_type_e:
      values: ["Adam", "RMSprop", "Adamax", "SGD"]
    lr_e:
      distribution: log_uniform_values
      min: 0.005
      max: 0.5
    weight_decay_e:
      values: [0.0, 0.001, 0.005]
    lr_decay_rate:
      values: [0.9, 0.95, 0.99]
    lr_scheduler_e:
      values: ["Lambda", "Cyclic", "Reduce"]
    # Variance-only params (removed for expectation sweeps)
    tol_var:
      value: 10.0
    optimizer_type_v:
      values: ["Adam", "RMSprop", "Adamax", "SGD"]
    lr_v:
      distribution: log_uniform_values
      min: 0.005
      max: 0.2
    weight_decay_v:
      values: [0.0, 0.001, 0.005]
    lr_scheduler_v:
      values: ["Lambda", "Cyclic", "Reduce"]
    lr_decay_rate_v:
      values: [0.8, 0.85, 0.9, 0.95]
    alternate_every:
      values: [null, 10, 25, 50]
    var_factor:
      values: [2, 3, 4, 5, 6, 7, 8, 9]
    # MMD-only params (removed for expectation and variance sweeps)
    kernel_bandwidth:
      values: [null, 0.5, 1.0, 2.0, 5.0]
    tol_mmd:
      values: [0.001, 0.005, 0.01, 0.05]
    n_trajectories:
      value: 100
