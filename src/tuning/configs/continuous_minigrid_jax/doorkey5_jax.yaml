environment:
  type: continuous_minigrid_jax
  env_name: "MiniGrid-DoorKey-5x5-v0"
  grid_size: 5
  T: 70
  gamma: 1.0
  n_trajectories_eval: 150

demonstrator:
  training_algorithm: dqn
  time_steps: 7500000
  n_trajectories: 150
  training_timesteps: 350000

wandb:
  project: "mceirl-continuous-minigrid-jax-tuning"
  sweep_count: 30

sweep:
  method: bayes
  metric:
    name: reward_diff_variance
    goal: maximize
  parameters:
    # Algorithm selection
    training_algorithm:
      value: "dqn"
    # Warm-starting config
    full_training_timesteps:
      values: [100000, 200000, 350000]
    finetune_timesteps:
      values: [2000, 5000, 10000]
    # CNN + RL config
    features_dim:
      values: [64, 128, 256]
    hidden_dims:
      values: [[64, 64], [128, 128], [256, 256]]
    rl_batch_size:
      values: [32, 64, 128]
    tau:
      values: [0.001, 0.005, 0.01]
    buffer_size:
      values: [25000, 50000, 100000]
    train_freq:
      values: [3, 5, 10]
    # DQN-specific
    dqn_lr:
      distribution: log_uniform_values
      min: 0.0001
      max: 0.005
    epsilon_decay:
      values: [0.995, 0.999, 0.9995]
    # IRL learner convergence (shared)
    tol_exp:
      values: [5.0, 10.0, 25.0, 50.0]
    maxiter:
      values: [30, 50, 75, 100, 200, 500]
    miniter:
      value: 1
    n_trajectories:
      value: 50
    # IRL optimizer config (shared - theta_e)
    lr_e:
      distribution: log_uniform_values
      min: 0.005
      max: 0.3
    lr_decay_rate:
      values: [0.9, 0.95, 0.975]
    # Variance-only params (removed for expectation and mmd sweeps)
    tol_var:
      values: [250.0, 500.0, 1000.0, 1250.0]
    lr_v:
      distribution: log_uniform_values
      min: 0.005
      max: 0.1
    lr_decay_rate_v:
      values: [0.9, 0.95, 0.975]
    alternate_every:
      values: [null, 5, 10, 25]
    var_factor:
      values: [2, 3, 4, 5]
    # MMD-only params (removed for expectation and variance sweeps)
    kernel_bandwidth:
      values: [null, 0.5, 1.0, 2.0]
    tol_mmd:
      values: [0.001, 0.005, 0.01, 0.05]
