environment:
  type: continuous_minigrid
  env_name: "MiniGrid-DoorKey-5x5-v0"
  grid_size: 5
  T: 70
  gamma: 1.0
  n_trajectories_eval: 150

demonstrator:
  training_algorithm: ppo
  time_steps: 7500000
  n_trajectories: 150

wandb:
  project: "mceirl-continuous-minigrid-tuning"
  sweep_count: 30

sweep:
  method: bayes
  metric:
    name: reward_diff_variance
    goal: maximize
  parameters:
    # Learner convergence (shared)
    tol_exp:
      values: [10.0, 25.0, 50.0]
    maxiter:
      values: [30, 50, 75]
    miniter:
      value: 1
    n_trajectories:
      value: 150
    # Optimizer config (shared - theta_e)
    optimizer_type_e:
      values: ["Adam", "RMSprop", "Adamax"]
    lr_e:
      distribution: log_uniform_values
      min: 0.01
      max: 0.3
    weight_decay_e:
      values: [0.0, 0.001]
    lr_decay_rate:
      values: [0.9, 0.95, 0.975]
    lr_scheduler_e:
      values: ["Lambda", "Reduce"]
    # Variance-only params (removed for expectation sweeps)
    tol_var:
      values: [500.0, 1000.0, 1250.0]
    optimizer_type_v:
      values: ["Adam", "RMSprop", "Adamax"]
    lr_v:
      distribution: log_uniform_values
      min: 0.005
      max: 0.1
    weight_decay_v:
      values: [0.0, 0.001]
    lr_scheduler_v:
      values: ["Lambda", "Reduce"]
    lr_decay_rate_v:
      values: [0.9, 0.95, 0.975]
    alternate_every:
      values: [null, 5, 10]
    var_factor:
      values: [2, 3, 4, 5]
    # Approximate-only params (shared)
    training_algorithm:
      values: ["dqn"]
    training_timesteps:
      values: [200000, 350000, 500000]
    policy_type:
      value: "CnnPolicy"
    buffer_size:
      values: [25000, 50000, 100000]
    tau:
      values: [0.001, 0.005, 0.01]
    train_freq:
      values: [3, 5, 10]
    features_dim:
      values: [64, 128, 256]
