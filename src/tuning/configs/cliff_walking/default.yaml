environment:
  type: cliff_walking
  gamma: 1.0
  success_rate: 1.0/3.0
  one_hot_features: false

demonstrator:
  T: 100

wandb:
  project: "mceirl-cliff-walking-tuning"
  sweep_count: 75

sweep:
  method: bayes
  metric:
    name: reward_diff_variance
    goal: maximize
  parameters:
    # Learner convergence (shared)
    tol_exp:
      values: [0.0001, 0.0005, 0.001, 0.005]
    maxiter:
      value: 5000
    miniter:
      value: 1
    # Optimizer config (shared - theta_e)
    optimizer_type_e:
      values: ["Adam", "RMSprop", "Adamax", "SGD"]
    lr_e:
      distribution: log_uniform_values
      min: 0.005
      max: 0.5
    weight_decay_e:
      values: [0.0, 0.001, 0.005]
    lr_decay_rate:
      values: [0.9, 0.95, 0.99]
    lr_scheduler_e:
      values: ["Lambda", "Cyclic", "Reduce"]
    # Variance-only params (removed for expectation sweeps)
    tol_var:
      values: [0.001, 0.005, 0.01, 0.05]
    optimizer_type_v:
      values: ["Adam", "RMSprop", "Adamax", "SGD"]
    lr_v:
      distribution: log_uniform_values
      min: 0.005
      max: 0.2
    weight_decay_v:
      values: [0.0, 0.001, 0.005]
    lr_scheduler_v:
      values: ["Lambda", "Cyclic", "Reduce"]
    lr_decay_rate_v:
      values: [0.8, 0.85, 0.9, 0.95]
    alternate_every:
      values: [null, 10, 25, 50]
    var_factor:
      values: [2, 3, 4, 5, 6, 7, 8, 9]
